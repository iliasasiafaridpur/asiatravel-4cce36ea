name: Keep database awake
on:
  schedule:
    - cron: "0 3 */3 * *"   # প্রতি ৩ দিন পর পর স্বয়ংক্রিয়ভাবে চলবে
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          CLEAN_URL="${URL%/}"
          curl -s "$CLEAN_URL/auth/v1/health" -H "apikey: $KEY"
          echo "Database ping successful!"
